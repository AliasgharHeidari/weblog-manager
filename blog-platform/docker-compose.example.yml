services:
  database:
    image: postgres:16-alpine
    container_name: bloghub-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: blog
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: bloghub-backend
    environment:
      DB_HOST: database
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: blog
      DB_PORT: 5432
      SERVER_PORT: 8080
      SESSION_KEY: secret-encrypt-password
    ports:
      - "8080:8080"
    depends_on:
      - database
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build: ./frontend
    container_name: bloghub-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data: